<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface)}
body{color:var(--text);font-family:var(--font-reading);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:1440px;height:900px;overflow:hidden;background:var(--surface);color:var(--text)}
h1,h2,h3,p,ol,ul,blockquote{margin:0;padding:0}
ol,ul{list-style:none}
button{font:inherit;color:inherit}
a{color:var(--pen-blue);text-decoration:underline dotted var(--pen-blue);text-decoration-thickness:2px;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.katex{font-size:1.08em}
/* maths letters and digits are Charter, so they match the reading text; symbols, Greek and big operators stay KaTeX */
@font-face{font-family:"Math Charter";src:url(../../fonts/Charter-Regular.woff2) format("woff2");font-weight:400;font-style:normal;unicode-range:U+30-39,U+41-5A,U+61-7A;size-adjust:92.6%}
@font-face{font-family:"Math Charter";src:url(../../fonts/Charter-Italic.woff2) format("woff2");font-weight:400;font-style:italic;unicode-range:U+30-39,U+41-5A,U+61-7A;size-adjust:92.6%}
@font-face{font-family:"Math Charter";src:url(../../fonts/Charter-Bold.woff2) format("woff2");font-weight:700;font-style:normal;unicode-range:U+30-39,U+41-5A,U+61-7A;size-adjust:92.6%}
@font-face{font-family:"Math Charter";src:url(../../fonts/Charter-BoldItalic.woff2) format("woff2");font-weight:700;font-style:italic;unicode-range:U+30-39,U+41-5A,U+61-7A;size-adjust:92.6%}
.katex,.katex .mathit,.katex .mathbf,.katex .mainrm{font-family:"Math Charter",KaTeX_Main,serif}
.katex .mathnormal,.katex .boldsymbol{font-family:"Math Charter",KaTeX_Math,serif}
/* the three pens: colour AND line style */
.pen{padding:0 1px;border-radius:var(--radius-sm)}
.pen-red{background:var(--pen-red-soft);border-bottom:2px solid var(--pen-red)}
.pen-green{background:var(--pen-green-soft);border-bottom:4px double var(--pen-green)}
.pen-blue{background:var(--pen-blue-soft);border-bottom:2px dotted var(--pen-blue)}
.pen-hint{border-top:1px solid var(--text-soft)}
/* top bar */
.topbar{height:48px;display:flex;align-items:center;gap:28px;padding:0 48px;border-bottom:1px solid var(--rule);background:var(--surface);font-family:var(--font-ui);font-size:13px;line-height:16px}
.brand{font-weight:700}
.proj{display:flex;align-items:center;gap:8px;height:30px;margin-left:-8px;padding:0;background:none;border:0;font-family:var(--font-ui);font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
.proj .mode{border:1px solid var(--rule-strong);border-radius:var(--radius-sm);padding:0 6px;font-size:12px;line-height:18px;color:var(--text-soft)}
.spaces{display:flex;gap:0;height:48px}
.spaces a{display:flex;align-items:center;padding:0 14px;color:var(--text-soft);text-decoration:none}
.spaces a[aria-current]{color:var(--text);font-weight:700;box-shadow:inset 0 -2px 0 var(--text)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.topbar-right a.quiet{color:var(--text-soft);text-decoration:none}
.palette{display:flex;align-items:center;gap:24px;height:30px;padding:0 10px 0 12px;background:var(--surface-1);border:1px solid var(--rule-strong);border-radius:var(--radius-md);color:var(--text-soft);font-family:var(--font-ui);font-size:13px;cursor:pointer}
.palette kbd{font-family:var(--font-ui);display:inline-flex;align-items:center;gap:2px;color:var(--text-soft)}
.you{background:none;border:0;color:var(--text-soft);font-family:var(--font-ui);font-size:13px;cursor:pointer}
/* buttons */
.btn{display:inline-flex;align-items:center;height:32px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:var(--radius-md);background:transparent;color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:16px;cursor:pointer}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--surface);font-weight:700}
.btn[aria-pressed="true"]{background:var(--surface-3);border-color:var(--text-soft)}
.kind{font-family:var(--font-ui);font-size:13px;line-height:16px;font-weight:700;color:var(--text)}
.meta{font-family:var(--font-ui);font-size:12px;line-height:16px;color:var(--text-faint)}
/* leaders */
svg.leaders{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:5}
svg.leaders path{fill:none}
.ld-red{stroke:var(--pen-red);stroke-width:1.75}
.ld-green{stroke:var(--pen-green);stroke-width:5}
.ld-green-gap{stroke:var(--surface);stroke-width:2}
.ld-blue{stroke:var(--pen-blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:.1 5}
.ld-hint{stroke:var(--rule-strong);stroke-width:1.25}
.dot-red{fill:var(--pen-red)}.dot-green{fill:var(--pen-green)}.dot-blue{fill:var(--pen-blue)}.dot-hint{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.25}
/* pin cards: pinned marks, not chat bubbles */
.pin{position:absolute;left:0;width:100%;background:var(--surface-1);border:1px solid var(--rule);border-radius:var(--radius-md);padding:8px 12px 10px;font-size:15px;line-height:1.45}
.pin-head{display:flex;align-items:center;gap:10px;font-family:var(--font-ui);font-size:12px;line-height:16px;color:var(--text-soft)}
.pin-head::before{content:"";width:26px;height:0;flex:none}
.pin-head b{color:var(--text);font-weight:700}
.pin-red .pin-head::before{border-top:2px solid var(--pen-red)}
.pin-green .pin-head::before{border-top:4px double var(--pen-green)}
.pin-blue .pin-head::before{border-top:2px dotted var(--pen-blue)}
.pin-hint .pin-head::before{border-top:1px solid var(--text-soft)}
.pin-quote{margin:4px 0 1px;font-style:italic;color:var(--text)}
.pin-quote>span{padding:0 2px;border-radius:var(--radius-sm)}
.pin-red .pin-quote>span{background:var(--pen-red-soft);border-bottom:2px solid var(--pen-red)}
.pin-green .pin-quote>span{background:var(--pen-green-soft);border-bottom:4px double var(--pen-green)}
.pin-blue .pin-quote>span{background:var(--pen-blue-soft);border-bottom:2px dotted var(--pen-blue)}
.pin-hint .pin-quote>span{border-top:1px solid var(--text-soft);background:var(--surface-3)}
.pin p+p{margin-top:5px}
.pin .who{font-family:var(--font-ui);font-size:12px;color:var(--text-faint)}

.atlas-wrap{position:absolute;left:0;right:0;top:48px;bottom:0;background:var(--surface);overflow:hidden}
svg.atlas{position:absolute;left:0;top:0;display:block}
.a-sea{fill:var(--surface)}
.a-grat{stroke:var(--survey-grid);stroke-width:1;fill:none}
.a-land{fill:var(--surface-1)}
.a-tint{fill:var(--text)}
.a-tint.t1{fill-opacity:.05}.a-tint.t2{fill-opacity:.05}.a-tint.t3{fill-opacity:.06}
.a-route{stroke:var(--rule-strong);stroke-width:1;fill:none;opacity:.75}
.a-fog{fill:var(--surface);fill-opacity:.58}
.a-fogdots{fill:url(#fogdots)}
.fogdot{fill:var(--text-soft);opacity:.5}
.a-contour{fill:none;stroke:var(--text-soft);stroke-width:1}
.a-contour.c1{opacity:.5}.a-contour.c2{opacity:.7}.a-contour.c3{opacity:.95;stroke-width:1.5}
.a-front{fill:none;stroke:var(--text);stroke-width:1.5}
.a-hach{stroke:var(--text);stroke-width:1.25;fill:none}
.a-outline{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:7 5}
.a-path-halo{fill:none;stroke:var(--surface);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.a-path{fill:none;stroke:var(--pen-blue);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 7.5}
.stop-ring{fill:none;stroke:var(--pen-blue);stroke-width:1.75;stroke-dasharray:.1 4.6;stroke-linecap:round}
.a-stopno{font-family:var(--font-map);font-variation-settings:"wdth" 84;font-weight:700;font-size:12px;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.m-none{fill:var(--surface);stroke:var(--text-faint);stroke-width:1.25}
.m-open{fill:var(--surface);stroke:var(--text);stroke-width:1.75}
.m-fill{fill:var(--text);stroke:none}
.ring-red{fill:none;stroke:var(--pen-red);stroke-width:2.2}
.ring-plain{fill:none;stroke:var(--text);stroke-width:1.5}
.ring-green-out,.ring-green-in{fill:none;stroke:var(--pen-green);stroke-width:1.6}
.a-label{font-family:var(--font-map);font-variation-settings:"wdth" 84;font-size:11px;fill:var(--text);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.a-label.dim{fill:var(--text-faint)}
.a-ref{fill:var(--text-faint)}
.a-folder{font-family:var(--font-map);font-variation-settings:"wdth" 90;font-weight:600;font-size:12px;fill:var(--text-soft);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.a-count{fill:var(--text-faint);font-weight:400}
.a-edge{font-family:var(--font-map);font-variation-settings:"wdth" 84;font-size:11px;fill:var(--text-faint)}
.a-tick{stroke:var(--rule-strong);stroke-width:1}
.lens{position:absolute;left:16px;top:16px;width:276px;background:var(--surface-1);border:1px solid var(--rule);border-radius:var(--radius-md);padding:12px 14px 14px;font-family:var(--font-ui);font-size:12px;line-height:16px;color:var(--text-soft)}
.lens h2{font-size:13px;line-height:16px;font-weight:700;color:var(--text);margin:0 0 8px}
.lens .chips{display:flex;flex-wrap:wrap;gap:6px}
.lens .btn{height:28px;padding:0 10px;font-size:12px}
.lens .legend{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.lens .legend li{display:flex;align-items:center;gap:10px;min-height:24px;padding:1px 0}
.lens .legend svg{flex:none;overflow:visible}
.lens .note{margin-top:8px;color:var(--text-faint)}
.north{position:absolute;right:44px;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-map);font-variation-settings:"wdth" 84;font-size:11px;line-height:14px;color:var(--text-soft);text-align:center;width:120px}
.north svg{display:block}
.hint{position:absolute;left:16px;bottom:14px;font-family:var(--font-ui);font-size:12px;color:var(--text-faint);background:var(--surface);padding:2px 6px}
.fabs{position:absolute;right:16px;bottom:14px;display:flex;gap:8px}
.fabs .btn{background:var(--surface-1)}

.a-land{fill:var(--surface-1)}
.w-top{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:7 5}
.w-sub{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-dasharray:2 4}
.w-closed{fill:var(--surface-2);fill-opacity:.9;stroke:var(--rule-strong);stroke-width:1.25}
.rt{fill:none;stroke:var(--text-soft);stroke-linecap:round;opacity:.9}
.rt.quiet{opacity:.45}
.rt-halo{fill:none;stroke:var(--surface);stroke-linecap:round;opacity:.75}
.rt-sel{fill:none;stroke:var(--pen-blue);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.1 7.5}
.rt-dep{fill:none;stroke:var(--pen-blue);stroke-width:1.9;stroke-linecap:round;stroke-dasharray:.1 4.2}
.a-front.thin{stroke-width:1;opacity:.8}
.m-land{fill:none;stroke:var(--text-soft);stroke-width:1}
.m-bar{stroke:var(--text-faint);stroke-width:1.25;fill:none}
.a-reach{fill:var(--text);fill-opacity:.06}
.calm .w-top{stroke-dasharray:none;stroke:var(--rule-strong)}
.calm .w-sub{stroke-dasharray:3 4}
.calm .a-land{fill:var(--surface-1)}
.lens .keybtn{margin-top:12px}
.tip{position:absolute;width:236px}
.tip .pin{position:relative}
.kinds{display:flex;flex-wrap:wrap;gap:4px 14px;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--rule)}
.kinds span{display:inline-flex;align-items:center;gap:6px}
.kinds svg{overflow:visible;flex:none}
.a-folder.sub{font-weight:500;font-size:11px}
.a-label.sel{font-weight:700}
.a-fogdots{fill:url(#fogdots)}
.crumbs{position:absolute;right:16px;top:16px;background:var(--surface-1);border:1px solid var(--rule);border-radius:var(--radius-md);padding:7px 12px;font-family:var(--font-ui);font-size:12px;line-height:16px;color:var(--text-soft)}
.crumbs b{color:var(--text)}
.selcard{position:absolute;width:264px}
.selcard .pin{position:relative}
.selcard .row{display:flex;gap:8px;margin-top:8px}
.selcard .btn{height:28px;padding:0 10px;font-size:12px}
.lens .legend .rtk{display:block}
.north{right:28px;bottom:64px}

.g-dots{stroke:var(--rule-strong);stroke-width:1.4;stroke-linecap:round;opacity:.45;fill:none}
.g-floor.d1{fill:var(--surface-1)}.g-floor.d2{fill:var(--surface-2)}.g-floor.d3{fill:var(--surface-3)}
.g-wall{fill:none;stroke:var(--rule-strong);stroke-width:1.25}
.g-wall.d2{stroke-width:1}
.g-front{fill:none;stroke:var(--text-soft);stroke-width:1;stroke-dasharray:1 3;stroke-linecap:round}
.g-title{font-family:var(--font-map);font-variation-settings:"wdth" 88;font-weight:600;fill:var(--text)}
.g-title .a-count{font-weight:400;fill:var(--text-soft)}
.gn{stroke:var(--rule-strong);stroke-width:1;fill:var(--surface)}
.gn.l1{stroke:var(--text);fill:var(--surface-1)}
.gn.l2,.gn.l3{stroke:var(--text);stroke-width:1.25;fill:var(--surface-3)}
.gn.bad{stroke:var(--pen-red);stroke-width:2}
.gn-ok{stroke:var(--pen-green);stroke-width:1.5;fill:none}
.g-note{font-family:var(--font-map);font-variation-settings:"wdth" 84;font-size:11px;fill:var(--text)}
.g-note.dim{fill:var(--text-faint)}
.gridmap .rt{stroke-linejoin:round}
.g-kind{fill:none;stroke:var(--text-soft);stroke-width:1.1}
.gridmap .m-bar{stroke:var(--text-soft)}
</style>

<body>
<div class="screen" data-theme="dark" data-dir="a">
<header class="topbar">
  <div class="brand">rdstudio</div>
  <button class="proj" type="button" aria-label="Switch project"><span>Differential geometry</span><span class="mode">Learning</span></button>
  <nav class="spaces" aria-label="Spaces"><a href="#" >Today</a><a href="#" >Library</a><a href="#" aria-current="page">Atlas</a><a href="#" >Practice</a></nav>
