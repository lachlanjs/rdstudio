[project]
name = "rdstudio"
version = "0.4.0"
description = "Agentic research and development studio: OKF knowledge bundles, a read-only dashboard, MCP and skills."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lachlan Stewart" }]
dependencies = [
    "nodejs-wheel-binaries>=24.19",   # Node itself; the program it runs is bundled (see launcher.py)
]

[project.scripts]
rdstudio = "rdstudio.launcher:main"      # the Node command line (see launcher.py)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdstudio"]
# The bundled Node program and the dashboard are built at release (npm run
# bundle, npm run build --workspace @rdstudio/app) and not committed.
artifacts = ["src/rdstudio/_node/*.mjs", "src/rdstudio/web/**"]

[tool.hatch.build.targets.sdist]
# Only the Python package (the TypeScript sources are on GitHub and npm), and
# the built files, since uv builds the wheel from this archive.
only-include = ["src/rdstudio", "README.md", "LICENSE"]
artifacts = ["src/rdstudio/_node/*.mjs", "src/rdstudio/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
bench = [
    "playwright>=1.63.0",
]
dev = [
    "pytest>=9.1.1",
]
