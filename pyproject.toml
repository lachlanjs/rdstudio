[project]
name = "rdstudio"
version = "0.1.0"
description = "Agentic research and development studio: OKF knowledge bundles, a read-only dashboard, MCP and skills."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lachlan Stewart" }]
dependencies = [
    "mcp>=2.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
rdstudio = "rdstudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
