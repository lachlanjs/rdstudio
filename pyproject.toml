[project]
name = "rdstudio"
version = "0.1.0"
description = "Agentic research and development studio: OKF knowledge bundles, a read-only dashboard, MCP and skills."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lachlan Stewart" }]
dependencies = [
    "markdown-it-py>=4.2.0",
    "mcp>=2.2.0",
    "nodejs-wheel-binaries>=24.19",
    "pyyaml>=6.0.3",
]

[project.scripts]
rdstudio = "rdstudio.launcher:main"      # the Node command line (see launcher.py)
rdstudio-py = "rdstudio.cli:main"        # the Python one, while it lasts

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdstudio"]
# The bundled Node program is built at release (npm run bundle) and not committed.
artifacts = ["src/rdstudio/_node/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
bench = [
    "playwright>=1.63.0",
]
dev = [
    "pytest>=9.1.1",
]
