<link id="code-dark" rel="stylesheet" href="vendor/hljs/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link id="theme-css" rel="stylesheet" href="themes/notebook.css">
<script>
  // Apply the saved theme before first paint (see js/settings.js).
  (function () {
    try {
      var themes = ["notebook", "journal", "modern", "blueprint", "terminal"];
      var theme = localStorage.getItem("rdstudio.theme"), mode = localStorage.getItem("rdstudio.mode");
      if (themes.indexOf(theme) > 0) document.getElementById("theme-css").href = "themes/" + theme + ".css";
      if (mode === "light" || mode === "dark") {
        document.documentElement.dataset.mode = mode;
        document.getElementById("code-light").media = mode === "light" ? "all" : "not all";
        document.getElementById("code-dark").media = mode === "dark" ? "all" : "not all";
      }
    } catch (e) { /* storage unavailable: defaults apply */ }
  })();
</script>
