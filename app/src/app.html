<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: on Android the on-screen keyboard shrinks the page, so the
     header, the editing bar and the editor's toolbar stay in view while typing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>rdstudio</title>
<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0d1219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235646c0'/%3E%3Ccircle cx='11' cy='12' r='3.2' fill='%23f4f6f2'/%3E%3Ccircle cx='22' cy='10' r='2.4' fill='%23f4f6f2'/%3E%3Ccircle cx='19' cy='22' r='3.6' fill='%23f4f6f2'/%3E%3Cpath d='M11 12 22 10M11 12l8 10M22 10l-3 12' stroke='%23f4f6f2' stroke-width='1.4'/%3E%3C/svg%3E">
<script>
  // Instant reopening and offline reading (sw.js), registered before anything
  // else loads so it installs even when a file fails. Browsers allow it only
  // on https or localhost; everything works without it. ?nosw skips it.
  (function () {
    // Back from signing in to a tunnel or proxy (the "Sign in" link): tidy the address.
    if (new URLSearchParams(location.search).has("signin")) history.replaceState(null, "", location.pathname + location.hash);
    if (!("serviceWorker" in navigator) || new URLSearchParams(location.search).has("nosw")) return;
    if (location.port === "5173") return; // the Vite dev server: no service worker
    var had = Boolean(navigator.serviceWorker.controller);
    (function register(tries) {
      navigator.serviceWorker.register("sw.js").catch(function () {
        if (tries < 3) setTimeout(function () { register(tries + 1); }, 800);
      });
    })(0);
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (had && performance.now() < 10000) location.reload();
    });
    // Tunnels sometimes drop a request (a 504): if a script or style fails,
    // reload once, when the service worker (which retries) is ready.
    var failed = false;
    addEventListener("error", function (e) {
      var t = e.target;
      if (failed || !t || !/^(SCRIPT|LINK)$/.test(t.tagName)) return;
      var last = Number(sessionStorage.getItem("rdstudio.retry") || 0);
      if (Date.now() - last < 30000) return;
      failed = true;
      sessionStorage.setItem("rdstudio.retry", String(Date.now()));
      var wait = new Promise(function (r) { setTimeout(r, 4000); });
      Promise.race([navigator.serviceWorker.ready, wait]).then(function () { location.reload(); });
    }, true);
  })();
</script>
<link id="theme-css" rel="stylesheet" href="%sveltekit.assets%/themes/marginalia.css">
<link rel="stylesheet" href="%sveltekit.assets%/themes/station.css">
<link rel="stylesheet" href="%sveltekit.assets%/fonts.css">
<script>
  // Apply the saved theme and mode before first paint (see lib/settings.svelte.ts).
  (function () {
    try {
      // Dark first; light, or following the system, when chosen. Marginalia, or Station over it.
      var mode = localStorage.getItem("rdstudio.mode");
      document.documentElement.dataset.mode = mode === "light" || mode === "system" ? mode : "dark";
      document.documentElement.dataset.theme = localStorage.getItem("rdstudio.theme") === "station" ? "station" : "marginalia";
      document.documentElement.dataset.scan = localStorage.getItem("rdstudio.scanlines") === "off" ? "off" : "on";
    } catch (e) { /* storage unavailable: defaults apply */ }
  })();
</script>
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
